<body class="alt">
  <a class="skip-link" href="#main">Skip to content</a>

  <header id="header" class="site-header">
    <div class="container">
      <nav class="navbar navbar-expand-lg navbar-dark site-nav">
        <a class="navbar-brand m-0" href="/" aria-label="Go to homepage">
          <span class="gn-logo">
            <img alt="galaxy supernova logo" src="2020/nu_logo.png">
          </span>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#primaryNav" aria-controls="primaryNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="primaryNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="#gallery" aria-current="page">Concept Images</a></li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="section-bg gv-section">
      <div class="container hero gv-container py-4 py-md-5">
        <h1 class="mb-1">CONCEPTS</h1>
        <p class="m-0">My concept WIP artwork</p>
      </div>
    </section>

    <section id="gallery" class="portfolio section-bg gv-section">
      <div class="container gv-container pb-4 pb-md-5">
        <div class="section-title gv-section-head mb-2 mb-md-3">
          <h2 class="gv-section-title mb-3">Gallery</h2>
          <p class="gv-section-sub mb-0">Some good and great things!</p>
        </div>

        <div id="galleryStatus" class="small mb-3" aria-live="polite">Loading…</div>

        <div id="galleryGrid" class="row g-3 g-md-4">
          <div class="col-12 col-sm-6 col-lg-4">
            <div class="card h-100 portfolio-card">
              <button type="button" class="portfolio-media js-lightbox" data-src="concept_images/digital-agony.PNG" data-title="digital-agony.PNG" aria-label="Open digital-agony.PNG">
                <img src="concept_images/digital-agony.PNG" class="img-fluid" alt="digital-agony.PNG" loading="lazy" decoding="async">
              </button>
              <div class="card-body">
                <h3 class="h6 mb-1 fw-bold">digital agon</h3>
                <div class="text-muted small">Concept</div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true" aria-label="Image viewer">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content lightbox-modal">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="lightboxTitle"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body pt-0">
            <img id="lightboxImg" class="img-fluid w-100" alt="">
          </div>
        </div>
      </div>
    </div>

  <footer class="site-footer" id="footer">
