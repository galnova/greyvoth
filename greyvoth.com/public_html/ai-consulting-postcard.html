<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Greyvoth AI Consulting — Postcard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap" rel="stylesheet">
  <style>
    @page { size: 6in 4in; margin: 0; }
  </style>
  <link rel="stylesheet" href="_css/ai.css">
</head>
<body class="ai-postcard">
<div class="card">

  <!-- Left: Brand + Content -->
  <div class="left">
    <div class="logo">
      <img src="2020/nu_logo.png" alt="Greyvoth">
    </div>

    <div class="headline">
      <span class="eyebrow">AI Consulting for Individuals &amp; Businesses</span>
      <h1>Put AI to Work.<br><span>Responsibly.</span></h1>
      <p>LLM strategy, AI ethics, and prompt engineering tailored for individuals and companies.</p>
    </div>

    <div class="services">
      <div class="service-pill"><span>◆</span>LLM Consulting</div>
      <div class="service-pill"><span>◆</span>AI Ethics</div>
      <div class="service-pill"><span>◆</span>Prompt Engineering</div>
    </div>
  </div>

  <!-- Right: QR + Contact -->
  <div class="right">

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="52" height="52" class="robot-icon">
      <circle cx="50" cy="50" r="49" fill="#14224a"/>
      <line x1="50" y1="25" x2="50" y2="16" stroke="#f6f7fb" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="50" cy="12" r="4" fill="#f6f7fb"/>
      <rect x="20" y="26" width="60" height="54" rx="9" fill="#f6f7fb"/>
      <rect x="27" y="35" width="14" height="9" rx="4.5" fill="#00C2FF"/>
      <rect x="59" y="35" width="14" height="9" rx="4.5" fill="#00C2FF"/>
      <path d="M 54,50 A 8,8 0 1,0 58,57 H 52" fill="none" stroke="#ffd35a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="32" y="71" width="36" height="5" rx="2.5" fill="#14224a" opacity="0.4"/>
      <g transform="translate(79,19)">
        <polygon points="0,-7 1.6,-1.6 7,0 1.6,1.6 0,7 -1.6,1.6 -7,0 -1.6,-1.6" fill="#00C2FF"/>
      </g>
      <circle cx="87" cy="28" r="2.2" fill="#ffd35a"/>
    </svg>

    <div class="qr-wrap">
      <p class="qr-label">Scan to Connect</p>
      <div id="qr-postcard"></div>
    </div>

    <div class="contact-block">
      <div class="accent-bar"></div>
      <p>
        <a href="https://greyvoth.com/about">greyvoth.com/about</a><br>
        greyvoth@gmail.com
      </p>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="_js/ai.js"></script>
</body>
</html>
