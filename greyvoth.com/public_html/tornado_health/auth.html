<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Approval Details | Tornado Health</title>
  <meta name="description" content="A prior authorization or referral: where it stands, the details, and what you can do. A portfolio demo with made-up data.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/fontawesome.min.css"
        integrity="sha384-AGSGRaBRodcsy1n0F2zMm+LfXuZry/ZJ6nfio36UgMuNBs/AOC8ciJ7py4SgkpoY" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/solid.min.css"
        integrity="sha384-H/BU8KfYKZ0VK4RJyclToSd6x8TmMY4/Rym2YtHXnGQOUZAoLIYIaOxkIfyTAuVh" crossorigin="anonymous">
  <link rel="stylesheet" href="css/portal.css">
  <link rel="preload" href="partials/header.html" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="partials/footer.html" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="data/member.json" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="data/coverage.json" as="fetch" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
  <script src="js/portal.js" defer></script>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100" data-page="auth">
  <a class="visually-hidden-focusable position-absolute top-0 start-0 z-3 m-2 px-3 py-2 bg-body rounded shadow" href="#main">Skip to main content</a>

  <!-- Header: one copy in partials/header.html, loaded here by js/portal.js -->
  <div class="shell-header" data-include="partials/header.html"></div>

  <!-- Main ============================================================== -->
  <main class="flex-grow-1" id="main" tabindex="-1">
    <!-- Page band: breadcrumb back to Coverage, then which approval (auth.html?id=a-mri) -->
    <header class="greeting-band">
      <div class="container-xl py-3 py-md-4">
        <nav class="band-crumbs mb-2" aria-label="Breadcrumb">
          <ol class="list-unstyled d-flex flex-wrap align-items-center gap-2 mb-0">
            <li><a href="coverage.html#auths-title">Coverage</a></li>
            <li aria-current="page" data-field="crumbCurrent">Approval</li>
          </ol>
        </nav>
        <h1 class="mb-2" data-field="pageTitle">Approval details</h1>
        <p class="band-facts mb-0" data-field="authFacts">&nbsp;</p>
      </div>
    </header>

    <!-- data-loading: everything here comes from the approval, so it stays hidden (keeping its place) until it's filled in -->
    <div class="container-xl py-4" data-loading aria-busy="true">
      <p class="visually-hidden" role="status" id="live-status"></p>
      <div class="notice notice-danger mb-4" role="alert" id="load-error" hidden>
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span>We couldn't load your information. Refresh the page to try again.</span>
      </div>
      <div class="notice notice-warning mb-4" role="alert" id="auth-missing" hidden>
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span>We couldn't find that approval. <a href="coverage.html#auths-title">See all approvals</a>.</span>
      </div>

      <div class="row g-4" data-auth>
        <div class="col-lg-8 vstack gap-4">
          <section class="card" aria-labelledby="auth-status-title">
            <div class="card-body p-4">
              <div class="d-flex flex-wrap align-items-center gap-2 mb-2" data-list="auth-badge"></div>
              <h2 class="mb-2" id="auth-status-title" data-field="authHeadline"></h2>
              <p class="mb-4 measure" data-field="authNext"></p>
              <h3 class="small fw-semibold text-body-secondary mb-3" id="auth-timeline-title">Where it stands</h3>
              <ol class="timeline list-unstyled mb-0" data-list="auth-timeline" aria-labelledby="auth-timeline-title"></ol>
            </div>
          </section>

          <section class="card" aria-labelledby="auth-details-title">
            <div class="card-body p-4">
              <h2 class="mb-3" id="auth-details-title">Details</h2>
              <dl class="acct-dl" data-list="auth-details"></dl>
            </div>
          </section>
        </div>

        <!-- What you can do: in view while the details scroll -->
        <div class="col-lg-4">
          <section class="card side-sticky" aria-labelledby="auth-actions-title">
            <div class="card-body p-4">
              <div data-auth-visits hidden>
                <h2 class="mb-1" id="auth-visits-title">Visits</h2>
                <p class="small text-body-secondary mb-2" data-field="authVisitsText"></p>
                <progress class="meter mb-4" data-meter="authVisits" aria-labelledby="auth-visits-title"></progress>
              </div>
              <h2 class="mb-3" id="auth-actions-title">What you can do</h2>
              <ul class="list-unstyled vstack gap-3 mb-0" data-list="auth-actions"></ul>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer, bottom nav, More sheet, AI Chat and dialogs: one copy in partials/footer.html, loaded here by js/portal.js -->
  <div data-include="partials/footer.html"></div>
</body>
</html>
