<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Start an Appeal | Tornado Health</title>
  <meta name="description" content="Ask the health plan to look again at a claim it didn't cover, in three steps. A portfolio demo with made-up data.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/fontawesome.min.css"
        integrity="sha384-AGSGRaBRodcsy1n0F2zMm+LfXuZry/ZJ6nfio36UgMuNBs/AOC8ciJ7py4SgkpoY" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/solid.min.css"
        integrity="sha384-H/BU8KfYKZ0VK4RJyclToSd6x8TmMY4/Rym2YtHXnGQOUZAoLIYIaOxkIfyTAuVh" crossorigin="anonymous">
  <link rel="stylesheet" href="css/portal.css">
  <link rel="preload" href="partials/header.html" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="partials/footer.html" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="data/member.json" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="data/claims.json" as="fetch" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
  <script src="js/portal.js" defer></script>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100" data-page="appeal">
  <a class="skip-link visually-hidden-focusable position-absolute top-0 start-0 m-2 px-3 py-2 bg-body rounded shadow" href="#main">Skip to main content</a>

  <!-- Header: one copy in partials/header.html, loaded here by js/portal.js -->
  <div class="shell-header" data-include="partials/header.html"></div>

  <!-- Main ============================================================== -->
  <main class="flex-grow-1" id="main" tabindex="-1">
    <!-- Page band: breadcrumb back to the claim, then which claim is being appealed (appeal.html?claim=c-1009) -->
    <header class="greeting-band">
      <div class="container-xl py-3 py-md-4">
        <nav class="band-crumbs mb-2" aria-label="Breadcrumb">
          <ol class="list-unstyled d-flex flex-wrap align-items-center gap-2 mb-0">
            <li><a href="claims.html">Claims</a></li>
            <li><a href="claims.html" data-appeal-claim-link data-field="appealCrumbClaim">Claim</a></li>
            <li aria-current="page">Appeal</li>
          </ol>
        </nav>
        <h1 class="mb-2">Start an appeal</h1>
        <p class="band-facts mb-0" data-field="appealFacts">&nbsp;</p>
      </div>
    </header>

    <!-- data-loading: the appeal is about one claim, so it stays hidden (keeping its place) until the claim is loaded -->
    <div class="container-xl py-4" data-loading aria-busy="true">
      <div class="notice notice-danger mb-4" role="alert" id="load-error" hidden>
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span>We couldn't load your information. Refresh the page to try again.</span>
      </div>

      <div class="row g-4">
        <!-- The form: three steps, one at a time, then the confirmation -->
        <div class="col-lg-8">
          <section class="card" aria-labelledby="appeal-step-title">
            <div class="card-body p-4" data-appeal></div>
          </section>
        </div>
        <!-- The claim being appealed: in view while the steps change -->
        <div class="col-lg-4">
          <section class="card side-sticky" aria-labelledby="appeal-claim-title">
            <div class="card-body p-4">
              <h2 class="mb-1" id="appeal-claim-title">About this claim</h2>
              <p class="small text-body-secondary mb-3" data-field="appealClaimFor"></p>
              <table class="table amount-table est-breakdown mb-3">
                <caption class="visually-hidden">What was billed and paid</caption>
                <tbody data-list="appeal-claim-amounts"></tbody>
              </table>
              <p class="notice notice-danger small mb-3"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i><span data-field="appealReason"></span></p>
              <p class="small text-body-secondary mb-0">You have 180 days from the decision to appeal. Questions? <a href="messages.html?new=1#messages">Message us</a> or call <a class="text-nowrap" href="tel:+18005550142">1-800-555-0142</a>.</p>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer, bottom nav, More sheet, AI Chat and dialogs: one copy in partials/footer.html, loaded here by js/portal.js -->
  <div data-include="partials/footer.html"></div>
</body>
</html>
